name: Run posting scheduler

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Ping scheduler endpoint
        run: |
          status=$(curl -s -o /tmp/body -w "%{http_code}" -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://reelforge-c2lj.onrender.com/api/cron/run")
          cat /tmp/body
          echo
          if [ "$status" -ge 300 ]; then
            echo "Request failed with status $status"
            exit 1
          fi
